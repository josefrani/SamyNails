<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8d5ac7"><meta name="description" content="Samy Nails Turnos - agenda de belleza">
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/logo-app.png">
<title>Samy Nails Turnos</title>
<style>
:root{--p:#8d5ac7;--p2:#b98ce7;--p3:#f4eaff;--ink:#29222e;--muted:#786c80;--bg:#fbf8fd;--white:#fff;--ok:#4b9b73;--danger:#c85b74;--shadow:0 10px 30px rgba(82,48,105,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf6fd,#fff);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg);box-shadow:0 0 35px rgba(0,0,0,.06)}header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #eee5f3;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid #e5d2f4}.brand strong{display:block;font-size:16px}.brand span{font-size:12px;color:var(--muted)}main{padding:22px 18px 92px}.hero{text-align:center;padding:12px 0 18px}.hero img{width:145px;height:145px;object-fit:cover;border-radius:50%;box-shadow:0 10px 30px rgba(141,90,199,.20);border:5px solid #fff}.hero h1{font-family:Georgia,serif;font-size:34px;margin:12px 0 3px}.hero p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid #eee5f3;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.service{border:1px solid #e9dff0;background:#fff;border-radius:17px;padding:17px 12px;text-align:left;transition:.15s}.service:hover{transform:translateY(-1px);border-color:#c7a5e3}.service b{display:block}.service small{color:var(--muted)}.primary{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,var(--p),#a66bd6);color:#fff;padding:15px 18px;font-weight:700;box-shadow:0 8px 18px rgba(141,90,199,.22)}.secondary{border:1px solid #deccee;background:#fff;color:var(--p);border-radius:14px;padding:12px 15px;font-weight:650}.danger{border:1px solid #f0ccd5;background:#fff5f7;color:var(--danger);border-radius:14px;padding:10px 13px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field select{width:100%;border:1px solid #dfd4e6;background:#fff;border-radius:13px;padding:13px;outline:none}.field input:focus,.field select:focus{border-color:var(--p);box-shadow:0 0 0 3px #eadcf6}.steps{display:flex;gap:5px;margin:4px 0 18px}.step{height:5px;flex:1;background:#e8dfed;border-radius:5px}.step.on{background:var(--p)}.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{padding:11px 4px;border:1px solid #e2d7e8;background:#fff;border-radius:12px}.slot.taken{opacity:.4;text-decoration:line-through}.slot.sel{background:var(--p);color:#fff;border-color:var(--p)}.turno{border-left:5px solid var(--p);padding:14px;background:#fff;border-radius:15px;box-shadow:0 5px 18px rgba(82,48,105,.08);margin:10px 0}.turno .top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#eee7f5;color:var(--p);font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:rgba(255,255,255,.97);border-top:1px solid #eadff0;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px max(8px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#766b7d;padding:6px;border-radius:12px;font-size:12px}.nav button.active{color:var(--p);background:var(--p3);font-weight:700}.nav span{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}.center{text-align:center}.muted{color:var(--muted)}.back{border:0;background:none;color:var(--p);font-weight:700;padding:0 0 12px}.adminbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.adminbar button{white-space:nowrap}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:13px;background:#f3ecf8;color:#5f4670;font-size:13px;margin:10px 0}.success{background:#edf8f2;color:#397257}.dangerbox{background:#fff0f3;color:#8e4354}.modal{position:fixed;inset:0;background:rgba(38,22,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}.modalbox{width:min(560px,100%);background:#fff;border-radius:25px 25px 0 0;padding:20px;max-height:88vh;overflow:auto}.x{float:right;border:0;background:#f4eef7;border-radius:50%;width:34px;height:34px}.logo-small{width:62px;height:62px;object-fit:cover;border-radius:50%}
</style></head>
<body><div class="app"><header><div class="brand"><img src="assets/logo-app.png"><div><strong>Samy Nails</strong><span>Turnos</span></div></div><button class="secondary" onclick="show('profile')">Mi perfil</button></header><main id="main"></main><nav class="nav"><button id="n-home" onclick="home()"><span>⌂</span>Inicio</button><button id="n-turnos" onclick="turnos()"><span>📅</span>Mis turnos</button><button id="n-admin" onclick="adminLogin()"><span>⚙</span>Admin</button></nav></div><div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='samyNailsV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{profile:null,services:[['Manos','💅','1 h'],['Pies','🦶','1 h'],['Soft Gel','💅','1 h 30'],['Capping','✨','1 h 15'],['Pestañas','👁️','1 h 30'],['Cejas','🤨','30 min'],['Peluquería','💇','1 h'],['Otros','➕','Variable']],bookings:[],blocked:[],admin:false};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function mainNav(id){['home','turnos','admin'].forEach(x=>document.getElementById('n-'+x)?.classList.toggle('active',x===id))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function home(){mainNav('home'); if(!db.profile)return welcome(); document.getElementById('main').innerHTML=`<section class="hero"><img src="assets/logo-app.png"><h1>Samy Nails</h1><p>Tu turno, fácil. 💜</p></section><div class="card"><h2>Hola, ${esc(db.profile.name.split(' ')[0])} 👋</h2><p class="muted">¿Qué querés hacer?</p><button class="primary" onclick="bookStart()">SACAR UN TURNO</button></div><div class="card"><h3>Tu próximo turno</h3>${nextBooking()||'<div class="empty">Todavía no tenés turnos próximos.</div>'}</div>`}
function welcome(){mainNav('home');document.getElementById('main').innerHTML=`<section class="hero"><img src="assets/logo-app.png"><h1>Samy Nails</h1><p>Turnos de belleza</p></section><div class="card"><h2>¡Hola! 👋</h2><p class="muted">Para comenzar, solo necesitamos tus datos.</p><div class="field"><label>Nombre y apellido</label><input id="pname" placeholder="Ej. María González"></div><div class="field"><label>Número de teléfono</label><input id="pphone" inputmode="tel" placeholder="Ej. 3442 123456"></div><button class="primary" onclick="saveProfile()">CONTINUAR</button></div>`}
function saveProfile(){let n=document.getElementById('pname').value.trim(),p=document.getElementById('pphone').value.trim();if(!n||!p)return alert('Completá nombre y teléfono.');db.profile={name:n,phone:p};save();home()}
function profile(){openModal(`<button class="x" onclick="closeModal()">×</button><h2>Mi perfil</h2><div class="field"><label>Nombre y apellido</label><input id="mn" value="${esc(db.profile?.name)}"></div><div class="field"><label>Teléfono</label><input id="mp" value="${esc(db.profile?.phone)}"></div><button class="primary" onclick="updateProfile()">GUARDAR</button>`)}
function updateProfile(){db.profile={name:document.getElementById('mn').value.trim(),phone:document.getElementById('mp').value.trim()};save();closeModal();home()}
function bookStart(){let step=1;let service=null,date=null,time=null;function render(){document.getElementById('main').innerHTML=`<button class="back" onclick="home()">← Volver</button><div class="steps"><i class="step ${step>=1?'on':''}"></i><i class="step ${step>=2?'on':''}"></i><i class="step ${step>=3?'on':''}"></i></div>${step===1?`<h2>Elegí tu servicio</h2><div class="grid">${db.services.map((s,i)=>`<button class="service" onclick="pickService(${i})"><span style="font-size:26px">${s[1]}</span><b>${esc(s[0])}</b><small>${esc(s[2])}</small></button>`).join('')}</div>`:step===2?`<h2>Elegí día y hora</h2><div class="field"><label>Día</label><input type="date" id="bdate" min="${today()}" value="${date||today()}" onchange="window.__date=this.value;renderBook()"></div><p class="muted">Horarios disponibles</p><div class="slotgrid">${slotsFor(date||today()).map(t=>`<button class="slot ${isTaken(date||today(),t)?'taken':''} ${time===t?'sel':''}" ${isTaken(date||today(),t)?'disabled':''} onclick="pickTime('${t}')">${t}</button>`).join('')}</div><button class="primary" style="margin-top:18px" ${time?'':'disabled'} onclick="nextBook()">CONTINUAR</button>`:`<div class="card"><div class="center"><img class="logo-small" src="assets/logo-app.png"><h2>Confirmá tu turno</h2></div><p><b>Cliente:</b> ${esc(db.profile.name)}</p><p><b>Servicio:</b> ${esc(service[0])}</p><p><b>Día:</b> ${fmt(date)}</p><p><b>Hora:</b> ${time}</p><button class="primary" onclick="confirmBook()">CONFIRMAR TURNO</button><button class="secondary" style="width:100%;margin-top:10px" onclick="bookStart()">Volver a empezar</button></div>`}`}
window.__renderBook=render;window.__pickService=(i)=>{service=db.services[i];step=2;date=today();time=null;render()};window.__pickTime=t=>{time=t;render()};window.__nextBook=()=>{if(time)step=3;render()};window.__confirmBook=()=>{db.bookings.push({id:Date.now(),name:db.profile.name,phone:db.profile.phone,service:service[0],date,time,status:'confirmado'});save();document.getElementById('main').innerHTML=`<div class="card center"><img class="logo-small" src="assets/logo-app.png"><h2>¡Turno confirmado! 💜</h2><p><b>${esc(service[0])}</b></p><p>📅 ${fmt(date)}<br>🕒 ${time}</p><p class="muted">Te esperamos 💜</p><button class="primary" onclick="turnos()">VER MIS TURNOS</button></div>`};
window.pickService=i=>window.__pickService(i);window.pickTime=t=>window.__pickTime(t);window.nextBook=()=>window.__nextBook();window.confirmBook=()=>window.__confirmBook();render()}
function renderBook(){window.__renderBook?.()}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function slotsFor(d){let day=new Date(d+'T12:00:00').getDay();if(day===0)return [];return ['09:00','10:00','11:00','12:00','14:00','15:00','16:00','17:00','18:00']}
function isTaken(d,t){return db.bookings.some(b=>b.date===d&&b.time===t&&b.status!=='cancelado')||db.blocked.some(b=>b.date===d&&b.time===t)}
function nextBooking(){let arr=db.bookings.filter(b=>b.status!=='cancelado'&&b.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(!arr[0])return null;let b=arr[0];return `<div class="turno"><div class="top"><b>${esc(b.service)}</b><span class="badge">CONFIRMADO</span></div><p>📅 ${fmt(b.date)}<br>🕒 ${b.time}</p><button class="danger" onclick="cancelBooking(${b.id})">Cancelar turno</button></div>`}
function turnos(){mainNav('turnos');if(!db.profile)return welcome();let arr=db.bookings.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));document.getElementById('main').innerHTML=`<h2>Mis turnos</h2>${arr.length?arr.map(b=>`<div class="turno"><div class="top"><b>${esc(b.service)}</b><span class="badge">${b.status.toUpperCase()}</span></div><p>📅 ${fmt(b.date)}<br>🕒 ${b.time}</p>${b.status!=='cancelado'&&b.date>=today()?`<button class="danger" onclick="cancelBooking(${b.id})">Cancelar turno</button>`:''}</div>`).join(''):'<div class="empty">Todavía no tenés turnos.</div>'}`}
function cancelBooking(id){if(confirm('¿Querés cancelar este turno?')){let b=db.bookings.find(x=>x.id===id);if(b)b.status='cancelado';save();turnos()}}
function adminLogin(){if(db.admin)return admin();openModal(`<button class="x" onclick="closeModal()">×</button><h2>Administración</h2><p class="muted">Demo inicial: ingresá el código de administración.</p><div class="field"><label>Código</label><input id="admcode" type="password" inputmode="numeric" placeholder="2468"></div><button class="primary" onclick="checkAdmin()">ENTRAR</button>`)}
function checkAdmin(){if(document.getElementById('admcode').value==='2468'){db.admin=true;save();closeModal();admin()}else alert('Código incorrecto.')}
function admin(){mainNav('admin');document.getElementById('main').innerHTML=`<h2>Administración</h2><div class="adminbar"><button class="secondary" onclick="adminAgenda()">Agenda</button><button class="secondary" onclick="adminServices()">Servicios</button><button class="secondary" onclick="adminBlocks()">Bloqueos</button></div><div class="card"><h3>Hoy</h3>${adminDay(today())}</div><div class="card"><h3>Configuración</h3><p class="muted">La V1 guarda los datos en este dispositivo. Para compartir la agenda entre celulares, el siguiente paso es conectar una base de datos.</p><button class="secondary" onclick="logoutAdmin()">Salir de admin</button></div>`}
function adminDay(d){let a=db.bookings.filter(b=>b.date===d&&b.status!=='cancelado').sort((x,y)=>x.time.localeCompare(y.time));return a.length?a.map(b=>`<div class="turno"><div class="top"><b>${b.time} — ${esc(b.name)}</b><span class="badge">${esc(b.service)}</span></div><p class="muted">📱 ${esc(b.phone)}</p><button class="danger" onclick="adminCancel(${b.id})">Cancelar</button></div>`).join(''):'<div class="empty">No hay turnos para hoy.</div>'}
function adminCancel(id){if(confirm('¿Cancelar turno?')){let b=db.bookings.find(x=>x.id===id);if(b)b.status='cancelado';save();admin()}}
function adminAgenda(){let d=prompt('Fecha (AAAA-MM-DD)',today());if(!d)return;openModal(`<button class="x" onclick="closeModal()">×</button><h2>Agenda</h2><p class="muted">${fmt(d)}</p>${adminDay(d)}<button class="secondary" style="width:100%" onclick="closeModal()">Cerrar</button>`)}
function adminServices(){openModal(`<button class="x" onclick="closeModal()">×</button><h2>Servicios</h2>${db.services.map((s,i)=>`<div class="turno"><b>${esc(s[0])}</b><span class="muted"> — ${esc(s[2])}</span><button class="danger" style="float:right" onclick="delService(${i})">Eliminar</button></div>`).join('')}<hr><h3>Agregar</h3><div class="field"><input id="sn" placeholder="Nombre del servicio"></div><div class="field"><input id="sd" placeholder="Duración"></div><button class="primary" onclick="addService()">AGREGAR SERVICIO</button>`)}
function addService(){let n=document.getElementById('sn').value.trim(),d=document.getElementById('sd').value.trim()||'Variable';if(!n)return;db.services.push([n,'✨',d]);save();adminServices()}
function delService(i){if(confirm('¿Eliminar este servicio?')){db.services.splice(i,1);save();adminServices()}}
function adminBlocks(){openModal(`<button class="x" onclick="closeModal()">×</button><h2>Bloquear horario</h2><div class="field"><label>Día</label><input id="bd" type="date" min="${today()}" value="${today()}"></div><div class="field"><label>Hora</label><input id="bt" type="time" value="12:00"></div><button class="primary" onclick="addBlock()">BLOQUEAR</button><h3>Bloqueos actuales</h3>${db.blocked.map((b,i)=>`<div class="turno"><b>${fmt(b.date)}</b> — ${b.time}<button class="danger" style="float:right" onclick="delBlock(${i})">Quitar</button></div>`).join('')||'<p class="muted">No hay bloqueos.</p>'}`)}
function addBlock(){db.blocked.push({date:document.getElementById('bd').value,time:document.getElementById('bt').value});save();adminBlocks()}
function delBlock(i){db.blocked.splice(i,1);save();adminBlocks()}
function logoutAdmin(){db.admin=false;save();home()}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')};function closeModal(){document.getElementById('modal').classList.add('hidden')}
window.show=what=>{if(what==='profile')profile()};
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
