<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b4db4"><title>Samy Nails Turnos V4</title><style>
:root{--v:#7b4db4;--l:#b79bd8;--bg:#f7f2fb;--ink:#30283a;--mut:#746b7c;--line:#e8dff0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#fcfaff,#f4edf9);color:var(--ink)}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #4b2b6710}.brand{font-weight:800;color:var(--v);font-size:20px}.admin{border:0;background:#fff;color:var(--mut);font-weight:700}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.hero{text-align:center}.logo{width:105px;height:105px;border-radius:50%;margin:0 auto 12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 25px #6d47871a}.logo img{width:100%;height:100%;object-fit:cover}.fallback{font-family:cursive;font-size:24px;font-weight:700}.sub{font:9px Arial;letter-spacing:2px}.hero h1{font-size:25px;margin:8px 0 3px}.tag{font-size:17px;color:var(--mut);margin:0 0 18px}.big{display:block;width:min(100%,420px);margin:0 auto 22px;padding:18px;border:0;border-radius:17px;background:linear-gradient(135deg,#8153b8,#a776cc);color:#fff;font-size:19px;font-weight:800;box-shadow:0 10px 25px #8053b83b}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #5d39780b}.card h2{font-size:18px;margin:0 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left}.service.sel{border-color:var(--v);background:#f7f0fb}.service strong{display:block}.service span{font-size:12px;color:var(--mut)}.promo{display:none;margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}.promo img{width:100%;display:block;max-height:420px;object-fit:cover}.promo div{padding:10px 14px;font-size:13px;color:var(--mut)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #ddd3e6;border-radius:10px;background:#fff;font:inherit}textarea{min-height:80px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}.slot.sel{background:var(--v);color:#fff}.notice{padding:11px 13px;border-radius:10px;background:#f3edf8;font-size:13px;margin-top:10px}.ok{background:#eaf5ed;color:#376747}.err{background:#fae9ed;color:#963e57}.empty{padding:14px;background:#faf7fc;border-radius:10px;color:var(--mut);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button{cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:10px;padding:12px 15px;font-weight:800}.primary{background:var(--v);color:#fff}.secondary{background:#eee7f3}.danger{background:#f8e7ec;color:#b84c69}.hidden{display:none!important}.booking{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.booking small{color:var(--mut)}.adminPanel{position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;padding:20px}.adminBox{max-width:760px;margin:25px auto;background:#fff;border-radius:20px;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:34px;height:34px}.section{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}.asvc{display:flex;gap:8px;margin:7px 0}.asvc .name{flex:1}.asvc .dur{width:100px}@media(max-width:520px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="brand">SAMY NAILS</div><button class="admin" onclick="openAdmin()">ADMINISTRACIÓN</button></header><main class="wrap"><section class="hero"><div class="logo"><img id="logoImg" class="hidden"><div id="fallback"><div class="fallback">Samy Nails</div><div class="sub">BEAUTY &amp; NAIL ART</div></div></div><h1 id="hello">Hola</h1><p class="tag">Tu turno, fácil.</p><button class="big" onclick="start()">PEDIR TURNO</button></section><section class="card"><h2>¿Qué querés hacer?</h2><div class="grid" id="services"></div><div id="info" class="notice hidden"></div></section><div class="promo" id="promo"><img id="promoImg"><div id="promoText"></div></div><section class="card hidden" id="book"><h2>Elegí tu turno</h2><label>Nombre</label><input id="name" placeholder="Tu nombre"><label>Teléfono</label><input id="phone" placeholder="Tu teléfono"><label>Fecha</label><input id="date" type="date" onchange="slots()"><label>Horario disponible</label><div class="slots" id="slotsBox"></div><label>Notas / Observaciones <span style="font-weight:400;color:#8a7d91">(opcional)</span></label><textarea id="notes" placeholder="¿Querés dejar alguna indicación?"></textarea><div class="actions"><button class="primary" onclick="confirmTurn()">CONFIRMAR TURNO</button><button class="secondary" onclick="back()">VOLVER</button></div><div id="msg"></div></section><section class="card"><h2>Mis turnos</h2><div id="mine"><div class="empty">Todavía no hay turnos guardados en este dispositivo.</div></div></section></main><div class="adminPanel hidden" id="adminPanel"><div class="adminBox"><div class="head"><h2>Administración</h2><button class="close" onclick="closeAdmin()">×</button></div><div id="adminLogin"><label>Clave</label><input id="pass" type="password"><div class="actions"><button class="primary" onclick="adminLogin()">INGRESAR</button><button class="secondary" onclick="resetAdminPassword()">RESTABLECER A 1234</button></div><div class="notice">Clave inicial: <b>1234</b></div></div><div id="adminContent" class="hidden"><div class="section"><h3>Servicios</h3><div id="adminServices"></div><div class="actions"><button class="primary" onclick="addService()">+ AGREGAR SERVICIO</button></div></div><div class="section"><h3>Horarios por día</h3><label>Fecha</label><input type="date" id="adminDate"><label>Horarios de inicio separados por coma</label><input id="adminSlots" placeholder="09:00, 10:00, 11:00, 14:00"><div class="actions"><button class="primary" onclick="saveHours()">GUARDAR HORARIOS</button></div></div><div class="section"><h3>Logo</h3><input type="file" accept="image/*" onchange="image(this,'logo')"></div><div class="section"><h3>Promoción</h3><input type="file" accept="image/*" onchange="image(this,'promo')"><label>Texto opcional</label><input id="promoCaption"><div class="actions"><button class="danger" onclick="removePromo()">QUITAR PROMOCIÓN</button></div></div><div class="section"><h3>Turnos</h3><div id="adminBookings"></div></div><div class="section"><h3>Cambiar clave</h3><input id="newPass"><div class="actions"><button class="secondary" onclick="changePass()">CAMBIAR CLAVE</button></div></div></div></div></div><script>
const K='samyV4Fixed';let db=JSON.parse(localStorage.getItem(K)||'null')||{services:[{id:1,name:'Manos semipermanentes',duration:60},{id:2,name:'Pies semipermanentes',duration:60},{id:3,name:'Soft Gel',duration:90},{id:4,name:'Capping',duration:75}],hours:{},bookings:[],password:'1234',logo:'',promo:'',promoCaption:''};const save=()=>localStorage.setItem(K,JSON.stringify(db));const mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};const dur=n=>n<60?n+' min':n%60?Math.floor(n/60)+' h '+n%60+' min':n/60+' h';const selected=()=>[...document.querySelectorAll('.service.sel')].map(x=>+x.dataset.id);const total=()=>selected().reduce((s,id)=>s+(db.services.find(x=>x.id===id)?.duration||0),0);function renderServices(){services.innerHTML='';db.services.forEach(s=>{let b=document.createElement('button');b.className='service';b.dataset.id=s.id;b.innerHTML='<strong>'+s.name+'</strong><span>'+dur(s.duration)+'</span>';b.onclick=()=>{b.classList.toggle('sel');info.classList.toggle('hidden',!selected().length);if(selected().length)info.textContent='Seleccionaste '+selected().length+' servicio(s) · duración total: '+dur(total());slots()};services.appendChild(b)})}function start(){book.classList.remove('hidden');date.min=new Date().toISOString().slice(0,10);if(!date.value)date.value=date.min;book.scrollIntoView({behavior:'smooth'});slots()}function slots(){slotsBox.innerHTML='';let d=date.value,t=total();if(!d||!t){slotsBox.innerHTML='<div class="empty">Elegí una fecha y servicios.</div>';return}let used=db.bookings.filter(b=>b.date===d&&b.status!=='cancelado');let av=(db.hours[d]||[]).filter(s=>{let a=mins(s),z=a+t;return !used.some(b=>a<mins(b.slot)+b.duration&&z>mins(b.slot))}).sort((a,b)=>mins(a)-mins(b));if(!av.length){slotsBox.innerHTML='<div class="empty">No hay turnos disponibles para esta fecha.</div>';return}av.forEach(s=>{let b=document.createElement('button');b.className='slot';b.textContent=s;b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};slotsBox.appendChild(b)})}function confirmTurn(){let n=name.value.trim(),p=phone.value.trim(),d=date.value,s=document.querySelector('.slot.sel'),t=total();if(!n||!p||!d||!s||!t){msg.className='notice err';msg.textContent='Completá nombre, teléfono, fecha, servicios y horario.';return}let a=mins(s.textContent),z=a+t;if(db.bookings.some(b=>b.date===d&&b.status!=='cancelado'&&a<mins(b.slot)+b.duration&&z>mins(b.slot))){msg.className='notice err';msg.textContent='Ese horario acaba de ser ocupado. Elegí otro.';slots();return}db.bookings.push({id:Date.now(),name:n,phone:p,date:d,slot:s.textContent,duration:t,services:selected(),notes:notes.value.trim(),status:'pendiente'});save();msg.className='notice ok';msg.textContent='¡Turno solicitado correctamente!';renderMine();setTimeout(back,700)}function back(){book.classList.add('hidden');document.querySelectorAll('.service.sel').forEach(x=>x.classList.remove('sel'));info.classList.add('hidden');notes.value=''}function renderMine(){let n=name.value.trim(),a=db.bookings.filter(b=>b.status!=='cancelado'&&(!n||b.name.toLowerCase()===n.toLowerCase()));mine.innerHTML=a.length?a.map(b=>'<div class="booking"><b>'+b.date+' · '+b.slot+'</b><br>'+b.services.map(id=>db.services.find(s=>s.id===id)?.name).filter(Boolean).join(' + ')+'<br><small>'+dur(b.duration)+(b.notes?' · '+b.notes:'')+'</small></div>').join(''):'<div class="empty">Todavía no hay turnos guardados en este dispositivo.</div>'}name.addEventListener('input',()=>{hello.textContent=name.value?'Hola '+name.value:'Hola';renderMine()});function openAdmin(){adminPanel.classList.remove('hidden');adminLogin.style.display='block';adminContent.classList.add('hidden');pass.value=''}function closeAdmin(){adminPanel.classList.add('hidden')}function adminLogin(){if(pass.value===db.password){adminLogin.style.display='none';adminContent.classList.remove('hidden');renderAdmin()}else alert('Clave incorrecta. La clave inicial es 1234.')}
function resetAdminPassword(){if(confirm('¿Restablecer la clave a 1234?')){db.password='1234';save();alert('Clave restablecida a 1234.')}}function renderAdmin(){adminServices.innerHTML=db.services.map((s,i)=>'<div class="asvc"><input class="name" value="'+s.name.replaceAll('"','&quot;')+'" onchange="db.services['+i+'].name=this.value;save();renderServices()"><input class="dur" type="number" min="15" step="15" value="'+s.duration+'" onchange="db.services['+i+'].duration=+this.value;save();renderServices()"><button class="danger" onclick="db.services.splice('+i+',1);save();renderAdmin();renderServices()">×</button></div>').join('');adminBookings.innerHTML=db.bookings.length?db.bookings.slice().reverse().map(b=>'<div class="booking"><b>'+b.name+'</b> · '+b.date+' '+b.slot+'<br><small>'+b.phone+' · '+b.services.map(id=>db.services.find(s=>s.id===id)?.name).filter(Boolean).join(' + ')+'</small></div>').join(''):'<div class="empty">No hay turnos.</div>';promoCaption.value=db.promoCaption||''}function addService(){db.services.push({id:Date.now(),name:'Nuevo servicio',duration:60});save();renderAdmin();renderServices()}function saveHours(){let d=adminDate.value;if(!d)return alert('Elegí una fecha');db.hours[d]=[...new Set(adminSlots.value.split(',').map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x)))].sort((a,b)=>mins(a)-mins(b));save();slots();alert('Horarios guardados')}function image(inp,type){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db[type]=r.result;save();apply()};r.readAsDataURL(f)}promoCaption.onchange=()=>{db.promoCaption=promoCaption.value;save();apply()};function apply(){if(db.logo){logoImg.src=db.logo;logoImg.classList.remove('hidden');fallback.classList.add('hidden')}if(db.promo){promo.style.display='block';promoImg.src=db.promo;promoText.textContent=db.promoCaption||''}else promo.style.display='none'}function removePromo(){db.promo='';db.promoCaption='';save();apply();renderAdmin()}function changePass(){if(newPass.value.trim()){db.password=newPass.value.trim();save();newPass.value='';alert('Clave cambiada')}}adminDate.value=new Date().toISOString().slice(0,10);renderServices();apply();renderMine();
</script></body></html>
